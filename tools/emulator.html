<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMEN · Kindle-Emulator</title>
<style>
  :root{color-scheme:light;background:#e8e7e2;color:#191919;font:15px system-ui,sans-serif}
  body{margin:0}
  header{position:sticky;top:0;z-index:2;display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;background:#242424;color:#fff;padding:10px 18px}
  strong{letter-spacing:.18em}
  small{color:#d1d0cc}
  button,select,input{font:inherit;color:inherit}
  button,select,input{padding:6px 10px;background:#343434;border:1px solid #8c8c8c;border-radius:4px;text-decoration:none}
  button{cursor:pointer;touch-action:none}
  button:active{background:#f0f0f0;color:#151515}
  main{width:max-content;min-width:100%;box-sizing:border-box;padding:16px;text-align:center}
  .device{display:inline-block;position:relative;line-height:0;background:#f8f8f8;border:10px solid #252525;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px #0003}
  canvas{display:block;width:var(--panel-width);height:auto;aspect-ratio:var(--panel-ratio);image-rendering:pixelated;touch-action:none;user-select:none;cursor:crosshair}
  .fit canvas{width:min(var(--panel-width),calc(100vw - 52px),max(180px,calc((100dvh - var(--bar-height, 70px) - 52px) * var(--panel-ratio))));height:auto}
  .raster canvas{width:calc(3 * var(--panel-width));height:auto}
  .raster::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#7774 1px,transparent 1px),linear-gradient(#7774 1px,transparent 1px);background-size:3px 3px}
  .physical canvas{width:var(--physical-width)}
  #custom{display:flex;align-items:center;gap:6px}
  #custom[hidden]{display:none}
  #custom input{width:5ch}
  output{inline-size:137px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#d1d0cc}
</style>
<header>
  <strong>LUMEN</strong><small id="panel-label"></small><small id="backend"></small>
  <button id="power" title="Kurz drücken für Schlaf/Wachen, halten für das Power-Menü">Power</button>
  <label>Display <select id="preset">
    <option value="600,800,167">6″ · 600 × 800 · 167 PPI (2014)</option>
    <option value="1080,1440,300">6″ · 1080 × 1440 · 300 PPI (2026-Testprofil)</option>
    <option value="1072,1448,300">6″ · 1072 × 1448 · 300 PPI</option>
    <option value="1264,1680,300">7″ · 1264 × 1680 · 300 PPI</option>
    <option value="1860,2480,300">10.2″ · 1860 × 2480 · 300 PPI</option>
    <option value="custom">Benutzerdefiniert</option>
  </select></label>
  <form id="custom" hidden>
    <input name="width" aria-label="Breite in Pixeln" type="number" min="240" max="3000" required>
    <span>×</span>
    <input name="height" aria-label="Höhe in Pixeln" type="number" min="320" max="3000" required>
    <input name="ppi" aria-label="PPI" type="number" min="80" max="600" required>
    <button>Anwenden</button>
  </form>
  <label>Ansicht <select id="zoom"><option value="">1:1</option><option value="fit">Einpassen</option><option value="physical">PPI-Maßstab</option><option value="raster">Pixelraster 3×</option></select></label>
  <button id="download" type="button">PNG</button>
  <output id="status" aria-live="polite">Startet …</output>
</header>
<main><div class="device" id="device"><canvas id="screen" width="600" height="800" aria-label="LUMEN Touchscreen"></canvas></div></main>
<script>
"use strict";
const canvas = document.getElementById("screen"), status = document.getElementById("status");
const panel = __LUMEN_PANEL__;
document.getElementById("backend").textContent = panel.backend === "arm" ? "ARM · QEMU" : "Native Vorschau";
const context = canvas.getContext("2d", {alpha: false});
const root = document.documentElement;
const preset = document.getElementById("preset");
const custom = document.getElementById("custom");
const zoom = document.getElementById("zoom");
let bitmap = null;
function paint() {
  context.imageSmoothingEnabled = false;
  context.fillStyle = "#fff";
  context.fillRect(0, 0, canvas.width, canvas.height);
  if (bitmap) context.drawImage(bitmap, ...panel.viewport);
}
function setPanel(width, height, ppi) {
  const [logicalWidth, logicalHeight] = panel.logical;
  const scale = Math.min(width / logicalWidth, height / logicalHeight);
  const w = Math.min(width, Math.floor(logicalWidth * scale + 1e-9));
  const h = Math.min(height, Math.floor(logicalHeight * scale + 1e-9));
  if (touch !== null) {
    const id = touch;
    touch = null;
    canvas.releasePointerCapture(id);
    send(4);
  }
  Object.assign(panel, {width, height, ppi, viewport: [
    Math.floor((width - w) / 2), Math.floor((height - h) / 2), w, h
  ]});
  canvas.width = width;
  canvas.height = height;
  root.style.setProperty("--panel-width", width + "px");
  root.style.setProperty("--panel-ratio", width / height);
  root.style.setProperty("--physical-width", width * 96 / ppi + "px");
  document.getElementById("panel-label").textContent = width + " × " + height + " · " + ppi + " PPI";
  paint();
}
preset.onchange = () => {
  custom.hidden = preset.value !== "custom";
  if (!custom.hidden) {
    for (const name of ["width", "height", "ppi"]) custom.elements[name].value = panel[name];
  } else setPanel(...preset.value.split(",").map(Number));
};
custom.onsubmit = event => {
  event.preventDefault();
  const {width, height, ppi} = custom.elements;
  width.setCustomValidity(width.valueAsNumber > height.valueAsNumber ? "Ein Hochformat ist erforderlich." : "");
  if (custom.reportValidity()) setPanel(width.valueAsNumber, height.valueAsNumber, ppi.valueAsNumber);
};
for (const name of ["width", "height"]) {
  custom.elements[name].oninput = () => custom.elements.width.setCustomValidity("");
}
document.getElementById("download").onclick = () => canvas.toBlob(blob => {
  if (!blob) return;
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "lumen-screenshot.png";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
zoom.value = "fit";
const toolbar = document.querySelector("header");
new ResizeObserver(() => {
  document.documentElement.style.setProperty("--bar-height", toolbar.offsetHeight + "px");
}).observe(toolbar);
const updateZoom = () => {document.getElementById("device").className = "device " + zoom.value;};
zoom.onchange = updateZoom;
updateZoom();

const inputs = [];
let sending = false;
function send(kind, x = 0, y = 0) {
  const packet = [kind, x, y];
  const last = inputs.at(-1);
  if (kind === 2 && last?.[0] === 2) inputs[inputs.length - 1] = packet;
  else inputs.push(packet);
  if (!sending) flushInputs();
}
async function flushInputs() {
  sending = true;
  while (inputs.length) {
    try {
      const reply = await fetch("input", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(inputs.shift())
      });
      if (!reply.ok) throw new Error("Eingabe fehlgeschlagen");
    } catch {
      status.value = "Verbindung unterbrochen";
    }
  }
  sending = false;
}
function point(event, starting = false) {
  const r = canvas.getBoundingClientRect();
  const [left, top, width, height] = panel.viewport;
  const x = Math.floor((event.clientX - r.left) * panel.width / r.width);
  const y = Math.floor((event.clientY - r.top) * panel.height / r.height);
  if (starting && (x < left || x >= left + width || y < top || y >= top + height)) return null;
  return [
    Math.max(0, Math.min(panel.logical[0] - 1, Math.floor((x - left) * panel.logical[0] / width))),
    Math.max(0, Math.min(panel.logical[1] - 1, Math.floor((y - top) * panel.logical[1] / height)))
  ];
}
let touch = null;
canvas.onpointerdown = event => {
  if (touch !== null || event.button !== 0) return;
  const coordinates = point(event, true);
  if (!coordinates) return;
  event.preventDefault();
  touch = event.pointerId;
  canvas.setPointerCapture(touch);
  send(1, ...coordinates);
};
canvas.onpointermove = event => {
  if (event.pointerId !== touch) return;
  send(2, ...point(event));
};
canvas.onpointerup = event => {
  if (event.pointerId !== touch) return;
  touch = null;
  send(3, ...point(event));
};
canvas.onpointercancel = canvas.onlostpointercapture = event => {
  if (event.pointerId !== touch) return;
  touch = null;
  send(4, ...point(event));
};
canvas.oncontextmenu = event => event.preventDefault();

const power = document.getElementById("power");
let powerPointer = null;
power.onpointerdown = event => {
  if (powerPointer !== null || event.button !== 0) return;
  powerPointer = event.pointerId;
  power.setPointerCapture(powerPointer);
  send(5);
};
power.onpointerup = power.onpointercancel = power.onlostpointercapture = event => {
  if (event.pointerId !== powerPointer) return;
  powerPointer = null;
  send(6);
};
power.onclick = event => {
  if (event.detail === 0 && powerPointer === null) { send(5); send(6); }
};

async function frames() {
  let revision = 0;
  for (;;) {
    try {
      const response = await fetch("frame?after=" + revision, {cache: "no-store"});
      if (response.status === 204) continue;
      if (!response.ok) throw new Error("Bildabruf fehlgeschlagen");
      const next = await createImageBitmap(await response.blob());
      bitmap?.close();
      bitmap = next;
      paint();
      revision = Number(response.headers.get("X-Frame"));
      status.value = response.headers.get("X-Waveform") || "Bereit";
    } catch {
      status.value = "Emulator getrennt";
      await new Promise(resolve => setTimeout(resolve, 1000));
    }
  }
}
const initial = [panel.width, panel.height, panel.ppi];
preset.value = initial.join(",");
if (!preset.value) preset.value = "custom";
setPanel(...initial);
preset.onchange();
frames();
</script>
</html>
