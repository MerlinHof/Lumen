# LUMEN managed autostart v1 - remove only this job to uninstall.
description "LUMEN native reader session"
start on started lab126_gui
task
script
    # Never respawn: a clean exit or a crash returns to the Amazon UI.
    [ ! -e /tmp/lumen-boot-started ] || exit 0
    touch /tmp/lumen-boot-started
    count=0
    while [ ! -f /mnt/us/lumen/boot.sh ] && [ "$count" -lt 30 ]; do
        sleep 1
        count=$((count + 1))
    done
    [ -f /mnt/us/lumen/boot.sh ] || exit 0
    [ ! -e /mnt/us/lumen/DISABLE_AUTOSTART ] || exit 0
    sleep 8
    exec /bin/sh /mnt/us/lumen/boot.sh
end script
